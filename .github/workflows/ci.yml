# 候选人 PR 的公开评测。
#
# 触发：pull_request（fork 来的 PR 也触发；这类 run 没有 secrets、token 只读，
# 所以这里只做「校验目录 + 构建镜像 + 跑公开集」，不碰任何私密内容。
# 隐藏集与 Claude review 在 eval-on-demand.yml，由面试官评论 /eval 触发。
#
# check 名固定为 `submission`，main 的分支保护引用的就是它。
name: submission

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: submission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  submission:
    name: submission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 只允许改 submissions/<task>/<login>/ 这一个目录，且 login 必须等于 PR 作者。
      # 文件清单走 API 拿（--paginate，别让 100 个文件以上的 PR 被静默截断）。
      - name: Resolve submission directory
        id: sub
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')
          if [ -z "$files" ]; then
            echo "::error::PR 没有任何文件改动"; exit 1
          fi
          bad=$(printf '%s\n' "$files" | grep -Ev '^submissions/(E1|E2|E3)/[a-z0-9][a-z0-9-]*/' || true)
          if [ -n "$bad" ]; then
            echo "::error::以下文件不在 submissions/<E1|E2|E3>/<github-login>/ 下（login 需全小写）："
            printf '%s\n' "$bad"
            exit 1
          fi
          dirs=$(printf '%s\n' "$files" | sed -E 's#^(submissions/(E1|E2|E3)/[a-z0-9][a-z0-9-]*)/.*#\1#' | sort -u)
          n=$(printf '%s\n' "$dirs" | wc -l | tr -d ' ')
          if [ "$n" != "1" ]; then
            echo "::error::一个 PR 只能改一个提交目录，现在改了 ${n} 个："
            printf '%s\n' "$dirs"
            exit 1
          fi
          dir="$dirs"
          task=$(echo "$dir" | cut -d/ -f2)
          login=$(echo "$dir" | cut -d/ -f3)
          author_lc=$(echo "$AUTHOR" | tr '[:upper:]' '[:lower:]')
          if [ "$login" != "$author_lc" ]; then
            echo "::error::目录名 '${login}' 与 PR 作者 '${author_lc}' 不一致"; exit 1
          fi
          for f in Dockerfile README.md DEPLOY.md; do
            if [ ! -f "$dir/$f" ]; then
              echo "::error::缺少 ${dir}/${f}（DEPLOY.md 里要有 'URL: https://…' 一行，见 CONTRIBUTING.md）"; exit 1
            fi
          done
          case "$task" in
            E1) task_dir=tasks/E1-mini-brain ;;
            E2) task_dir=tasks/E2-workflow-automation ;;
            E3) task_dir=tasks/E3-wechat-autoreply ;;
          esac
          {
            echo "dir=$dir"
            echo "task=$task"
            echo "task_dir=$task_dir"
            echo "login=$login"
          } >> "$GITHUB_OUTPUT"
          echo "✅ ${dir} (${task})"

      # 上线探活。这是最后一条验收标准，和评测分数一样是硬门槛。
      # 排在 build 之前：它不依赖镜像，构建失败时候选人也该一次看到两个问题。
      # 地址从提交目录的 DEPLOY.md 里读（不读 PR 描述——改描述不会重跑 CI），
      # 解析与判定全在 scripts/check-deploy.sh 里，候选人本地跑的是同一个脚本。
      - name: Deployment liveness
        id: deploy
        env:
          DIR: ${{ steps.sub.outputs.dir }}
        run: |
          set +e
          set -uo pipefail
          if [ ! -f scripts/check-deploy.sh ]; then
            echo "::error::探活脚本 scripts/check-deploy.sh 不在仓里——这是仓库的问题，不是你的，请在 PR 里 @ 我们"
            echo "rc=3" >> "$GITHUB_OUTPUT"; exit 0
          fi
          bash scripts/check-deploy.sh "${DIR}/DEPLOY.md" 300 > deploy.out 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat deploy.out
          exit 0

      - uses: astral-sh/setup-uv@v6

      - name: Build candidate image
        env:
          DIR: ${{ steps.sub.outputs.dir }}
          LOGIN: ${{ steps.sub.outputs.login }}
        run: |
          set -euo pipefail
          timeout 600 docker build -t "sub:${LOGIN}" "$DIR"

      # 评测脚本的退出码就是结论；输出落文件再读，不接管道（pipefail 之外的保险）。
      - name: Public evaluation
        id: eval
        env:
          TASK_DIR: ${{ steps.sub.outputs.task_dir }}
          LOGIN: ${{ steps.sub.outputs.login }}
        run: |
          # GitHub 的 run: 默认是 `bash -e`；评测脚本按设计用退出码 1 表示「没过」，
          # 这里必须显式关掉 errexit，否则 rc 还没记录整步就被掐断（首发就踩了）。
          set +e
          set -uo pipefail
          uv run "${TASK_DIR}/eval/run.py" --image "sub:${LOGIN}" --mode public > eval.out 2> eval.err
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "--- eval stderr (tail) ---"; tail -n 60 eval.err || true
          echo "--- eval result ---"; tail -n 1 eval.out || true
          exit 0

      # 只写摘要，永远不失败；判定放在下一步，红的时候候选人一眼能看到是「Verdict」。
      # always()：构建失败时这一步也要跑，否则候选人连上线探活的结论都看不到。
      - name: Summary
        if: always() && steps.sub.outcome == 'success'
        env:
          RC: ${{ steps.eval.outputs.rc }}
          TASK: ${{ steps.sub.outputs.task }}
          LOGIN: ${{ steps.sub.outputs.login }}
          DEPLOY_RC: ${{ steps.deploy.outputs.rc }}
        run: |
          set -euo pipefail
          python3 - "$RC" "$TASK" "$LOGIN" <<'PY'
          import json, os, sys
          rc, task, login = sys.argv[1], sys.argv[2], sys.argv[3]
          deploy_rc = os.environ.get("DEPLOY_RC", "")
          last = ""
          try:
              lines = [l for l in open("eval.out", encoding="utf-8").read().splitlines() if l.strip()]
              last = lines[-1] if lines else ""
              res = json.loads(last)
          except Exception as e:
              res = None
          out = [f"## 公开集评测 · {task} · `{login}`", ""]
          if rc == "":
              out += ["⏭️ 公开集评测没有执行（镜像没构建出来）。看上面的 build 步骤。", ""]
          elif not res:
              out += ["❌ 评测脚本没有输出结果 JSON（容器起不来、或脚本异常）。看上一步的 stderr。", ""]
          else:
              out += [
                  f"| 分数 | 通过 | 硬违规 |", "|---|---|---|",
                  f"| **{res.get('score', 0):.2f}** | {res.get('passed', '?')}/{res.get('total', '?')} | {', '.join(res.get('hard_violations') or []) or '无'} |",
                  "",
              ]
              details = res.get("details") or []
              if details:
                  out += ["| 用例 | 结果 | 说明 |", "|---|---|---|"]
                  for d in details:
                      out.append(f"| `{d.get('id','')}` | {'✅' if d.get('ok') else '❌'} | {d.get('why','')} |")
                  out.append("")
          deploy_log = ""
          try:
              deploy_log = open("deploy.out", encoding="utf-8").read().strip()[-800:]
          except Exception:
              pass
          if deploy_rc == "0":
              out += ["### 上线 ✅", "", "线上地址可访问。评审期间请保持在线，我们会亲自打开用一遍。", ""]
          elif deploy_rc == "2":
              out += ["### 上线 ❌", "",
                      "`DEPLOY.md` 里的上线地址缺失或不合法（必须是公网地址）。第一行写成 `URL: https://你的线上地址`。", ""]
          elif deploy_rc == "3":
              out += ["### 上线 ⚠️", "", "探活脚本缺失——这是仓库的问题，不是你的。", ""]
          elif deploy_rc == "":
              out += ["### 上线 ⏭️", "", "探活没有执行。", ""]
          else:
              out += ["### 上线 ❌", "",
                      "线上地址在 5 分钟内没有返回 2xx/3xx。它必须公网可达、并在评审期间保持在线；"
                      "免费实例冷启动没关系，但它要能自己醒。", ""]
          if deploy_log:
              out += ["<details><summary>探活日志</summary>", "", "```", deploy_log, "```", "", "</details>", ""]
          out.append("隐藏集评测由面试官评论 `/eval` 触发。")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          print("\n".join(out))
          PY

      - name: Verdict
        env:
          RC: ${{ steps.eval.outputs.rc }}
          DEPLOY_RC: ${{ steps.deploy.outputs.rc }}
        run: |
          fail=0
          if [ "$RC" != "0" ]; then
            echo "::error::公开集评测未通过（硬违规或得分 < 0.5）。分数与逐题结果见上方 Summary。"
            fail=1
          fi
          case "${DEPLOY_RC}" in
            0) ;;
            2) echo "::error::上线验收未通过：DEPLOY.md 里没找到合法的上线地址。第一行写成 'URL: https://你的线上地址'（裸地址、公网可达）。"; fail=1 ;;
            3) echo "::error::探活脚本缺失，这是仓库的问题——请在 PR 里 @ 我们，别改你的提交。"; fail=1 ;;
            *) echo "::error::上线验收未通过：线上地址探不通。这是最后一条验收标准，不通过不进人工走读。修好后推一次 commit 重跑；如果你确认它是活的，在 PR 里说一声，我们可以在 Actions 页点 Re-run。"; fail=1 ;;
          esac
          if [ "$fail" != "0" ]; then exit 1; fi
          echo "✅ 公开集评测通过 + 线上地址可访问"
